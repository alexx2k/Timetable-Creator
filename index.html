<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timetable Creator</title>
<style>
html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#123a5a;color:#fff;font-family:Arial,Helvetica,sans-serif}.loading{display:flex;align-items:center;gap:12px;font-weight:700}.mark{width:34px;height:34px;border-radius:9px;background:#fff;box-shadow:inset 0 -5px 0 #e4c545}
</style>
</head>
<body>
<div class="loading"><span class="mark" aria-hidden="true"></span><span>Opening Timetable Creator…</span></div>
<script>
(async()=>{
 try{
  const response=await fetch('./app-v2.0.html');
  if(!response.ok)throw new Error(`Could not load application (${response.status})`);
  let html=await response.text();
  html=html.replace('</body>','<script src="./exact-half-coverage.js"><\/script></body>');
  document.open();
  document.write(html);
  document.close();
 }catch(error){
  console.error(error);
  document.body.innerHTML='<div style="max-width:520px;padding:28px;line-height:1.5"><strong>Timetable Creator could not open.</strong><br>Please refresh the page. If the problem continues, check that app-v2.0.html is available alongside index.html.</div>';
 }
})();
</script>
</body>
</html>
